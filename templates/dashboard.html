<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA — incident</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1A1A1A; --bg2:#212121; --card:#2B2B2B; --line:#3A3A3A;
  --fg:#F2F2F2; --muted:#9B9B9B; --dim:#6E6E6E;

  --red:#EF4444; --red-bg:#3B1416; --red-bd:#EF4444; --red-fg:#FF8A8A;
  --grn:#22C55E; --grn-bg:#14401F; --grn-bd:#1E6B33; --grn-fg:#5FE87C;
  --amb:#F59E0B; --amb-bg:#3A2A0B; --amb-bd:#A9741A; --amb-fg:#FFC04D;
  --banner:#B32222;

  --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased}

/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:20px;padding:14px 26px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  background:rgba(26,26,26,.95);backdrop-filter:blur(8px);flex-wrap:wrap}
.brand{font-weight:600;font-size:15px}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--grn);
  display:inline-block;margin-right:8px;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}
  70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;
  display:flex;gap:16px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:500}
.toggle{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);
  cursor:pointer;user-select:none}
.switch{width:36px;height:19px;border-radius:10px;background:var(--line);
  position:relative;transition:.2s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:13px;height:13px;
  border-radius:50%;background:var(--muted);transition:.2s}
.toggle.on .switch{background:rgba(245,158,11,.3)}
.toggle.on .switch::after{left:20px;background:var(--amb)}
.toggle.on{color:var(--amb)}

main{display:grid;grid-template-columns:290px 1fr}
aside{border-right:1px solid var(--line);overflow-y:auto;height:calc(100vh - 52px)}
.rail-h{padding:14px 18px 8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.run{padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;
  border-left:3px solid transparent;transition:background .15s}
.run:hover{background:var(--bg2)}
.run.active{background:var(--card);border-left-color:var(--red)}
.run.fresh{animation:landed 2.6s ease-out}
@keyframes landed{0%{background:rgba(245,158,11,.25)}100%{background:transparent}}
.run .t{font-size:13px;font-weight:500;margin-bottom:5px}
.run .s{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.pill{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:3px;
  text-transform:uppercase;letter-spacing:.06em;margin-right:7px}
.pill.r{background:rgba(239,68,68,.16);color:var(--red-fg)}
.pill.g{background:rgba(34,197,94,.14);color:var(--grn-fg)}

section{padding:26px 34px 60px;overflow-y:auto;height:calc(100vh - 52px)}

/* ---------- incident banner ---------- */
.banner{display:flex;align-items:center;gap:16px;background:var(--banner);
  border-radius:8px;padding:16px 22px;margin-bottom:34px;
  animation:slide .4s ease both}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.banner .warn{font-size:20px;line-height:1}
.banner h2{margin:0 0 3px;font-size:16px;font-weight:600;color:#FFD9D9}
.banner .sub{font-family:var(--mono);font-size:11.5px;color:#F3B4B4}
.banner .big{margin-left:auto;font-family:var(--mono);font-size:26px;font-weight:600;
  color:#FFE3E3;white-space:nowrap}

/* ---------- headline metric ---------- */
.headline{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.headline .k{font-size:14px;color:var(--muted);width:100%;margin-bottom:2px}
.headline .v{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-1px}
.headline .d{font-family:var(--mono);font-size:14px}
.headline .exp{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.chev{display:block;margin:14px auto 18px;color:var(--dim);font-size:15px;text-align:center}

/* ---------- metric tree ---------- */
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;margin-bottom:30px}
.mcard{border-radius:8px;padding:15px 18px;border:1.5px solid;
  animation:rise .35s ease both}
.mcard:nth-child(2){animation-delay:.05s}.mcard:nth-child(3){animation-delay:.1s}
.mcard:nth-child(4){animation-delay:.15s}.mcard:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mcard.g{background:var(--grn-bg);border-color:var(--grn-bd)}
.mcard.g .k,.mcard.g .v,.mcard.g .s{color:var(--grn-fg)}
.mcard.r{background:var(--red-bg);border-color:var(--red-bd)}
.mcard.r .k{color:var(--red-fg)}.mcard.r .v{color:#fff}.mcard.r .s{color:var(--red-fg)}
.mcard.a{background:var(--amb-bg);border-color:var(--amb-bd)}
.mcard.a .k,.mcard.a .v,.mcard.a .s{color:var(--amb-fg)}
.mcard .k{font-size:13px;margin-bottom:7px}
.mcard .v{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.5px}
.mcard .s{font-family:var(--mono);font-size:11px;margin-top:7px;opacity:.9}

/* ---------- diagnosis ---------- */
.diag{background:var(--card);border-radius:10px;padding:22px 24px;margin-bottom:28px}
.diag .lab{font-size:12px;color:var(--muted);margin-bottom:10px}
.diag .body{font-size:16.5px;line-height:1.6;font-weight:500}
.diag .body .raw{display:block;margin-top:12px;font-family:var(--mono);font-size:11.5px;
  color:var(--dim);line-height:1.55;font-weight:400}
.diag .foot{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.diag .foot span{display:flex;align-items:center;gap:6px}

/* ---------- localisation ---------- */
.loc-h{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);
  padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:4px}
.loc-h .right{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.loc{display:flex;align-items:center;gap:14px;padding:13px 2px;
  border-bottom:1px solid rgba(58,58,58,.55);flex-wrap:wrap}
.loc .id{font-family:var(--mono);font-size:13px}
.loc .dim{font-size:11px;color:var(--dim);font-family:var(--mono)}
.loc .nums{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.loc .nums b{color:var(--red);font-weight:500}
.loc .why{width:100%;font-size:12.5px;color:var(--muted);line-height:1.5;padding-top:2px}
.loc .bar{width:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.loc .bar i{display:block;height:100%;background:var(--red);transition:width .5s}

/* ---------- health ---------- */
.health{margin-top:38px;border-top:1px solid var(--line);padding-top:22px}
.health h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);font-weight:500;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;
  margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:5px}
.kpi .v small{font-size:11px;color:var(--muted);font-weight:400}
.ok{color:var(--grn-fg)}.bad{color:var(--red-fg)}.warn{color:var(--amb-fg)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
th{text-align:left;color:var(--dim);font-weight:500;padding:6px 10px 6px 0;
  border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase}
td{padding:6px 10px 6px 0;border-bottom:1px solid rgba(58,58,58,.5);color:var(--muted)}
td.s-success{color:var(--grn-fg)}td.s-failure{color:var(--red-fg)}

#toast{position:fixed;bottom:24px;right:24px;background:var(--card);
  border-left:3px solid var(--amb);padding:13px 18px;border-radius:6px;
  font-family:var(--mono);font-size:12px;transform:translateY(80px);opacity:0;
  transition:.35s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:300px}
#toast.show{transform:none;opacity:1}
#toast b{color:var(--amb)}
.empty{color:var(--dim);font-family:var(--mono);font-size:12px;padding:70px 0;
  text-align:center;line-height:1.9}
.err{border:1px solid var(--red);background:rgba(239,68,68,.08);color:var(--red-fg);
  padding:14px 16px;border-radius:6px;font-family:var(--mono);font-size:12px;line-height:1.6}
@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto;max-height:210px}
  section{height:auto;padding:20px}.headline .v{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><i></i>RCA &middot; incident view</div>
  <div class="toggle on" id="tog" onclick="flip()"><div class="switch"></div>Plain English</div>
  <div class="meta" id="pulse">connecting&hellip;</div>
</header>

<main>
  <aside>
    <div class="rail-h">Incidents</div>
    <div id="runlist"><div class="empty">loading&hellip;</div></div>
  </aside>
  <section id="detail"><div class="empty">Pick an incident.<br>New batches appear on their own.</div></section>
</main>

<div id="toast"></div>

<script>
let PLAIN = true, ACTIVE = null, FP = null, FIRST = true;
const $ = s => document.querySelector(s);

const num = (n, d) => n === null || n === undefined || isNaN(n) ? '—'
  : Number(n).toLocaleString('en-US',
      {minimumFractionDigits: d ?? 0, maximumFractionDigits: d ?? 0});
const money = n => '₹' + num(n, Math.abs(n) >= 1000 ? 0 : 2);
const auto = n => Math.abs(n) >= 1000 ? num(n, 0)
  : num(n, 4).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
const pct = (a, b) => (b ? ((a - b) / Math.abs(b)) * 100 : 0);
const isMoney = m => /revenue|ecpm|cpm|spend|cost|price/i.test(m || '');

function toast(m){ const t=$('#toast'); t.innerHTML=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 5000); }

/* severity: green = normal, red = the driver, amber = anomaly but minor */
function sev(s){
  if(s.verdict !== 'anomaly') return 'g';
  return Math.abs(s.contrib || 0) >= 50 ? 'r' : 'a';
}
const SEVWORD = {g:'normal', a:'watch', r:'driver'};

async function pulse(){
  try{
    const p = await (await fetch('/api/pulse')).json();
    if(p.error) throw new Error(p.error);
    $('#pulse').innerHTML = `rows <b>${p.total_rows}</b>`
      + `<span>incidents <b>${p.runs}</b></span>`
      + `<span>batches <b>${p.batches}</b></span>`
      + `<span>last load <b>${p.latest}</b></span>`;
    if(FP && p.fingerprint !== FP){
      toast(`<b>New batch landed.</b><br>${p.total_rows} rows &middot; ${p.runs} incidents`);
      await loadRuns(true);
    }
    FP = p.fingerprint;
  }catch(e){ $('#pulse').innerHTML = `<span class="bad">clickhouse unreachable — ${e.message}</span>`; }
}

async function loadRuns(highlight){
  const r = await (await fetch('/api/runs')).json();
  if(r.error){ $('#runlist').innerHTML = `<div class="err">${r.error}</div>`; return; }
  const seen = new Set([...document.querySelectorAll('.run')].map(e=>e.dataset.id));
  $('#runlist').innerHTML = r.runs.map(x=>{
    const anom = x.anomaly_steps > 0;
    const fresh = highlight && !seen.has(x.run_id) ? ' fresh' : '';
    return `<div class="run${fresh}${x.run_id===ACTIVE?' active':''}" data-id="${x.run_id}"
             onclick="openRun('${x.run_id}')">
      <div class="t">${x.headline_metric || 'metric'} anomaly &middot; ${x.headline_segment || 'global'}</div>
      <div class="s"><span class="pill ${anom?'r':'g'}">${anom?x.anomaly_steps+' flagged':'clean'}</span>
        ${String(x.window_start).slice(0,10)} &middot; ${x.steps} steps</div>
    </div>`;
  }).join('') || '<div class="empty">No incidents yet.<br>Load a batch.</div>';
  if(FIRST && r.runs.length){ FIRST = false; openRun(r.runs[0].run_id); }
}

async function openRun(id){
  ACTIVE = id;
  document.querySelectorAll('.run').forEach(e=>e.classList.toggle('active', e.dataset.id===id));
  $('#detail').innerHTML = '<div class="empty">diagnosing&hellip;</div>';
  const d = await (await fetch(`/api/run/${id}?plain=${PLAIN}`)).json();
  if(d.error){ $('#detail').innerHTML = `<div class="err">${d.error}</div>`; return; }
  render(d); health();
}

function render(d){
  const S = d.steps;
  const head   = S.find(s=>s.step_type==='detection') || S[0];
  const final  = S.find(s=>s.step_type==='final') || S[S.length-1];
  const global = S.filter(s=>s!==head && s!==final &&
                   (s.dimension==='global' || s.dim_value==='all'));
  const local  = S.filter(s=>s!==head && s!==final && !global.includes(s));

  const driver = [...global, ...local].filter(s=>s.verdict==='anomaly')
                   .sort((a,b)=>Math.abs(b.contrib||0)-Math.abs(a.contrib||0))[0] || head;
  const hPct = pct(head.actual, head.baseline);
  const hFmt = isMoney(head.metric) ? money : auto;
  const days = Math.max(1, Math.round(
    (new Date(d.header.window_end) - new Date(d.header.window_start)) / 864e5));

  const diagText = PLAIN && final.plain ? final.plain : final.rationale;
  const raw = PLAIN && final.plain && final.plain !== final.rationale
    ? `<span class="raw">original &middot; ${final.rationale}</span>` : '';

  $('#detail').innerHTML = `
  <div class="banner">
    <div class="warn">&#9888;</div>
    <div>
      <h2>${driver.metric} anomaly</h2>
      <div class="sub">${d.header.window_start.slice(0,10)} &rarr; ${d.header.window_end.slice(0,10)}
        &middot; loaded ${d.header.loaded_at.slice(11,16)} IST &middot; ${days} day${days>1?'s':''}</div>
    </div>
    <div class="big">${pct(driver.actual, driver.baseline).toFixed(1)}%</div>
  </div>

  <div class="headline">
    <div class="k">${head.metric}</div>
    <div class="v">${hFmt(head.actual)}</div>
    <div class="d ${Math.abs(hPct)>10?'bad':'warn'}">${hPct.toFixed(1)}% &middot;
      ${Math.abs(hPct)>10?'outside normal range':'within normal range'}</div>
    <div class="exp">expected ${hFmt(head.baseline)}</div>
  </div>
  <div class="chev">&#8964;</div>

  <div class="tree">${global.map(mcard).join('')}</div>

  <div class="diag">
    <div class="lab">Diagnosis</div>
    <div class="body">${diagText}${raw}</div>
    <div class="foot">
      <span>&#9201; diagnosed in ${(d.latency_ms/1000).toFixed(1)}s</span>
      <span>&#10003; ${S.length} steps, all logged</span>
      <span>${d.llm.called ? '&#9889; '+d.llm.model : '&#9889; cached &middot; '+d.llm.cache_hits+' rationales'}</span>
      ${d.trace_id ? `<span>&#8676; trace ${d.trace_id.slice(0,12)}</span>` : ''}
    </div>
  </div>

  ${local.length ? `
    <div class="loc-h">Localised to ${local[0].dimension} &middot; picked by contribution
      <span class="right">${local.length} segment${local.length>1?'s':''} affected</span></div>
    ${local.map(lrow).join('')}` : ''}

  <div class="health"><h3>Pipeline health &middot; last 24h</h3>
    <div class="kpis" id="kpis"></div><div id="healthbox"></div></div>`;
}

function mcard(s){
  const f = isMoney(s.metric) ? money : auto;
  return `<div class="mcard ${sev(s)}">
    <div class="k">${s.metric}</div>
    <div class="v">${f(s.actual)}</div>
    <div class="s">${pct(s.actual,s.baseline).toFixed(1)}% &middot; ${SEVWORD[sev(s)]}
      &middot; was ${f(s.baseline)}</div>
  </div>`;
}

function lrow(s){
  const f = isMoney(s.metric) ? money : auto;
  const why = PLAIN && s.plain ? s.plain : s.rationale;
  return `<div class="loc">
    <div><div class="id">${s.dim_value}</div>
      <div class="dim">${s.dimension} &middot; ${s.step_name}</div></div>
    <div class="nums">${f(s.baseline)} &rarr; <b>${f(s.actual)}</b>
      &middot; explains ${num(s.contrib,0)}%</div>
    <div class="bar"><i style="width:${Math.min(100,Math.abs(s.contrib||0))}%"></i></div>
    <div class="why">${why}</div>
  </div>`;
}

function flip(){
  PLAIN = !PLAIN;
  $('#tog').classList.toggle('on', PLAIN);
  if(ACTIVE) openRun(ACTIVE);
}

async function health(){
  const h = await (await fetch('/api/health')).json();
  if(h.error || !$('#kpis')) return;
  const k = h.kpi;
  $('#kpis').innerHTML = [
    ['calls 24h', k.calls, ''],
    ['success', k.ok, 'ok'],
    ['failure', k.failed, k.failed>0?'bad':''],
    ['success rate', k.success_rate+'<small>%</small>', k.success_rate>=95?'ok':'warn'],
    ['p95', k.p95_ms+'<small>ms</small>', ''],
    ['llm calls', k.llm_calls, ''],
    ['cache hits', k.cache_hits, 'ok'],
  ].map(([a,b,c])=>`<div class="kpi"><div class="k">${a}</div><div class="v ${c}">${b}</div></div>`).join('');

  $('#healthbox').innerHTML = `<table><tr><th>time</th><th>endpoint</th><th>status</th>
    <th>stage</th><th>ms</th><th>error</th></tr>` +
    h.recent.map(r=>`<tr><td>${r.ts.slice(11,19)}</td><td>${r.endpoint}</td>
      <td class="s-${r.status}">${r.status}</td><td>${r.stage}</td>
      <td>${r.latency_ms}</td><td>${r.error||'—'}</td></tr>`).join('') + `</table>`;
}

pulse(); loadRuns(false);
setInterval(pulse, 4000);
setInterval(()=>{ if(ACTIVE) health(); }, 15000);
</script>
</body>
</html>
